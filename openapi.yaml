openapi: 3.1.0

info:
  title: dsh-pet HTTP API
  version: 0.3.7
  summary: DSH 桌宠插件的宿主 HTTP 接口
  description: |
    dsh-pet 的宿主（host）半侧通过 DSH 的 `webServer` 服务注册**一条前缀路由** `/dsh-pet-7340`，
    浏览器半侧、桌面 Electron 半侧、以及设置页全都消费同一份实现（`handlePetRoute`）。
    本文件是该路由的公开契约：任何第三方插件 / 脚本都可以按此访问桌宠能力。

    ## 部署形态

    接口挂在 **DSH 自己的 Web 服务**上，因此没有固定端口：

    - `servers` 里的 `http://127.0.0.1:{port}` 是占位——`{port}` 就是 `ctx.webServer.port`，
      也就是 `dsh web` 启动时打印的地址（未显式指定端口时默认 3080）。
      插件本身不固定监听端口，只往宿主的 Web 服务上挂路由。
    - 只监听 **127.0.0.1**，不对外网暴露，也**没有任何鉴权**：任何能访问本机该端口的进程都能调用。
      请勿把该端口转发/代理到公网。
    - 桌面半侧不走 HTTP，而是 `dsh-pet-bridge://` 自定义 scheme 经主进程管道转发到**同一个**
      `handlePetRoute`。所以下表所有路径对两端行为完全一致。

    ## 两分钟上手

    ```bash
    BASE=http://127.0.0.1:3080/dsh-pet-7340

    # 1. 拉一次统一状态（只读、零副作用，可以随便轮询）
    curl -s $BASE/state

    # 2. 让 main 这只宠物立刻说一句（动作端点：只回 {ok}，内容去 /state 里取）
    curl -s -X POST "$BASE/whisper?pet=main"
    curl -s $BASE/state   # → pets.main.say.data.text
    ```

    ## 数据流：为什么有"动作端点"和"/state"两套

    这是本 API 最重要的一条约定，理解了它其余都是细节：

    1. **数据只有一个出口**：`GET /state`。它返回宿主内存里的一份"已发布状态" S，
       里面是若干 **叶子（leaf）**，每个叶子形如 `{ counter, data }`。
    2. **动作端点不返回数据**：`POST /balance`、`POST /whisper`、`POST /broadcast`、`POST /anim`、
       `POST /chat` 只回 `{ ok: true }`，
       表示"这次动作做完了"。它们在宿主内部把结果**写进 S**，调用方随后拉一拍 `/state` 就能看到。
    3. **`counter` 是"变了没有"的唯一信号**：它是 `Date.now()` 且**严格递增**（同毫秒连写会 +1），
       宿主重启也不会倒退。消费端只比较 `counter` 是否与自己上次记录的一致，一致就跳过渲染。
       这样前端不需要任何业务知识就能统一处理所有叶子。

    因此推荐的消费姿势是：

    - **要数据** → 每秒 `GET /state`，比对 `counter`，只处理变化的叶子。
    - **要触发行为** → `POST` 对应动作端点，收到 `ok` 后**立刻**再 `GET /state` 一次，
      即可 0 延迟拿到结果（不必等下一个轮询周期）。

  license:
    name: MIT
    identifier: MIT

externalDocs:
  description: 项目仓库与使用说明
  url: https://github.com/PC2005-cloud/dsh-pet

servers:
  - url: http://127.0.0.1:{port}
    description: |
      本机 DSH Web 服务。`{port}` = `ctx.webServer.port`（`dsh web` 默认 3080）。
      路由前缀固定为 `/dsh-pet-7340`（7340 是历史遗留的名字，**不是端口号**）。
    variables:
      port:
        default: "3080"
        description: DSH Web 服务实际监听的端口

tags:
  - name: State
    description: 统一状态轮询——前端 1 秒一次的唯一数据源，只读、纯内存、零副作用
  - name: Action
    description: 动作端点——触发一次宿主行为，写进 State，只回 `{ ok }`
  - name: Config
    description: 配置的读取、保存与元信息
  - name: Assets
    description: 字体、通知图标、表情包、动画素材
  - name: Gateway
    description: |
      宿主无关网关（`/capabilities` · `/agents` · `/events` · `/state/stream`）——让**任意 agent**
      不依赖 DSH 也能接入桌宠：自述能力、登记在场、推送气泡/六档状态、订阅状态流。
      档位：L0 在场（capabilities/hello）· L1 只读（agents/state/stream）· L2 驱动（events）。
      设计依据见 `docs/07-architecture-host-agnostic.md`（v2.2）。
  - name: Relays
    description: |
      中转站管理（`/relays` 子域）——管理多个 LLM API 中转站的资产：余额 / 健康 / 模型清单 / 焦点站。
      **本子域是「数据直返」例外**：动作类端点直接返回结果数据而不是 `{ ok }`
      （agent 一次调用就要拿到结果）；该例外只限 `/relays`，不扩散到 `/balance`、`/whisper` 等既有端点。
      凭证明文零外泄：站点与凭证分文件存储，每个响应体返回前过脱敏自检。

paths:
  /dsh-pet-7340/state:
    get:
      tags: [State]
      operationId: getState
      summary: 拉取统一状态 S
      description: |
        返回宿主内存中的已发布状态 S，形状固定为：

        ```jsonc
        {
          "configVersion": "1755000000000",
          "sections": {
            "balance":    { "counter": 1755000000000, "data": { /* BalanceState */ } },
            "workStatus": { "counter": 1755000000001, "data": { /* WorkStatusSnapshot */ } },
            "notify":     { "counter": 1755000000002, "data": { /* NotifyFrame */ } }
          },
          "pets": {
            "main": { "say": { "counter": 1755000000003, "data": { "text": "……" } } }
          }
        }
        ```

        **约定与注意事项**：

        - `sections` 是**全局**段，所有端共享一份；`pets.<id>` 是**每只宠物**各自一份。
        - **`configVersion` 不是叶子**（没有 `counter`/`data`，不参与 counter 比对）：它是配置文件的
          版本指纹，与上一拍不同就说明配置被改过——桌面端右键改了显示位置、另一个页面保存了配置、
          或用户手工编辑了 `main-config.jsonc` / `pet/*.json`。消费端此时应重拉 `GET /config`。
          老版本宿主不带该字段（`undefined`），按"无从判断"处理即可，不要误触发重拉。
        - 叶子 `data` 为 `null` 表示"从未写过"（此时 `counter` 为 `0`）；消费端应跳过它。
        - **`counter` 只在内容被写入时更新**，不是每次请求都变。所以"数据没变"和"接口挂了"
          要区分开：后者表现为 HTTP 非 2xx 或连接失败。
        - 响应带 `cache-control: no-cache, no-store`，可以放心轮询。
        - **本端点绝不触发外部调用或模型生成**——它只读内存。这是硬保证：1 秒一次的轮询
          不能因为某个慢请求而卡住所有人。
        - 路径（`sections.balance`、`pets.<id>.say`）请当作**不透明键**使用，
          **不要按 `.` 切分**：宠物 id 允许包含点号（例如 `a.b`），切分必然出错。
          要提取 id 请用固定前缀/后缀做切片。
        - 宠物 id 是配置里 `pets[].id`，默认是 `main`。要拿到全部 id 请看 `GET /config`。
      responses:
        "200":
          description: 当前状态
          headers:
            cache-control:
              description: 恒为 `no-cache, no-store`
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PollState"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "500":
          $ref: "#/components/responses/InternalError"

  /dsh-pet-7340/balance:
    post:
      tags: [Action]
      operationId: refreshBalance
      summary: 立即刷新一次余额
      description: |
        用**当前对话的服务商**（`ctx.agentDefaultModel.currentSelection()`）查一次余额，
        并把结果写进 `sections.balance`。这是 `POST` 动作端点，**不返回余额数据**。

        - 余额不可用时（服务商不支持 / 缺凭证 / 抓取失败）同样写入 S，
          以 `{ ok: false, reason, message }` 形式表达；此时本端点**依然返回 `ok: true`**，
          因为"刷新动作本身"完成了。要区分请读 `sections.balance.data.ok`。
        - 写入时会带上 `manual: true` 标记（只在本次刷新是用户主动触发时），
          消费端据此决定"余额不可用时要不要必弹文字说明"。
        - 常规的周期刷新由宿主**自己的定时器**完成（周期来自配置
          `eventsRefreshSec.balance`，默认 1800 秒），前端不需要轮询它。
      responses:
        "200":
          description: 刷新动作已完成（不代表余额可用）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkResponse"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"

  /dsh-pet-7340/whisper:
    post:
      tags: [Action]
      operationId: whisper
      summary: 让指定宠物立刻说一句
      description: |
        按该宠物所属条目的 `whisperPrompt` 人设生成一句碎碎念，写入 `pets.<id>.say`。
        这是 `POST` 动作端点，**不返回文本**——文本只有一个出口（`/state`）。

        - `whisperEnabled` 配置**不门控本端点**：那个字段只关自动周期碎碎念，
          手动/接口触发始终可用，不受它影响。
        - 生成失败时**不写 S**（不会伪造文案、也不会弹错误气泡），宿主打一条 `console.warn`，
          本端点返回 `{ ok: false, reason: 'generate-error' }`。
        - 若该宠物条目开启了 `whisperImageEnabled` 且表情包池非空，
          会随机抽一张配图，随文本一起写进叶子的 `image` 字段。
        - 模型选择：条目配置的 `whisperModel` 优先；留空则跟随当前对话的模型。
          指定模型生成失败时会**自动回落到当前对话的模型**重试一次。
      parameters:
        - $ref: "#/components/parameters/PetIdQuery"
      responses:
        "200":
          description: |
            生成结果。注意 HTTP 状态码**恒为 200**（除 405）：失败通过 `ok: false` 表达，
            这样调用方只需解析一层即可，不必区分"HTTP 失败"与"业务失败"。
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/OkResponse"
                  - $ref: "#/components/schemas/FailureResponse"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"

  /dsh-pet-7340/broadcast:
    post:
      tags: [Action]
      operationId: broadcast
      summary: 第三方投喂——把外部给定的文本写进气泡
      description: |
        与 `POST /whisper` 的分工：**这个端点不生成内容**，调用方自己给文本，宿主只负责搬运
        并显示。宿主侧其他插件（例如"女仆"巡检插件想在巡检完替主人说一句）用它把文本送进
        桌宠气泡，桌宠就成了那套人格的实体。

        文本写进 `pets.<id>.say` —— 与碎碎念、对话回复**同一个叶子**，因此浏览器与桌面两端
        在 1 秒内自动显示，**消费端无需改动**。这是动作端点，只回 `{ ok }`，文本本身从
        `/state` 读。

        **校验**（任何一条不通过都返回 HTTP 200 + `ok: false`，与 `POST /chat` 口径一致）：

        - `text` 必填，`trim()` 后不得为空；
        - **不设长度限制，也不限频**：投喂是显式的调用方行为，内容与频率都由调用方自己负责，
          宿主不做静默丢弃、截断或排队；
        - `pet` 必须是一只真实存在的桌宠；缺省时落到当前桌宠，仍为空则兜底 `main`；
        - `image` 只接受**该桌宠条目表情包池内**的名称（即该条目 `memes` 里、且在其表情包目录链
          —— `pet/<素材根>-memes/`（独占）或 `memes/` → 包内 `assets/memes/` ——里真实存在的键）。
          传入外部 URL 或池外名称一律拒绝——前端因此永远不会去加载任意外部地址
          （与对话选图共用同一份校验）。
      parameters:
        - name: pet
          in: query
          required: false
          description: |
            目标桌宠 id。**缺省时落到当前桌宠**（宿主内部按已选/首个有效桌宠解析），
            仍无法确定时兜底 `main`。指定的 id 不存在 → `ok: false` + `reason: unknown-pet`。
          schema:
            type: string
          example: main
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [text]
              properties:
                text:
                  type: string
                  description: 要让桌宠说的话。`trim()` 后不得为空；不设长度限制。
                image:
                  type: string
                  description: |
                    可选配图**名称**（配置 `memes` 的键 = 图文件名去扩展名，不含路径）。
                    必须在该桌宠条目的 `memes` 里、且在其表情包目录链里真实存在，否则 `ok: false` +
                    `reason: unknown-image`。不接受 URL。
                  example: 可爱
            examples:
              textOnly:
                summary: 只说一句
                value:
                  text: 主人，该喝水了
              withMeme:
                summary: 带一张包内表情包
                value:
                  text: 巡检完毕，一切正常
                  image: 厉害了我的鲸
      responses:
        "200":
          description: |
            恒为 200（除 405/400）。失败通过 `ok: false` 表达，`reason` 可能是
            `bad-request`（空文本/超长）、`unknown-pet`、`unknown-image`、
            `generate-error`（配置不可读等）。
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/OkResponse"
                  - $ref: "#/components/schemas/FailureResponse"
        "400":
          description: '请求体不是合法 JSON（`{ "error": "invalid JSON body" }`）'
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"

  /dsh-pet-7340/anim:
    post:
      tags: [Action]
      operationId: playAnimation
      summary: 点播动画——让桌宠播一段指定动画
      description: |
        效果与**右键菜单里点「动作」树完全一致**：两端都复用同一个菜单动作处理函数
        （浏览器 `handleMenuAction` / 桌面 `sprite.onMenuAction`），所以镜像修正（文字类朝右时
        先强制朝左）、移动类走真实位移、其余播一遍这些语义天然一致。

        名字写进 `pets.<id>.anim`，消费端在 1 秒内轮询发现 `counter` 变化后换源播放。
        **动画名即素材文件名**（`/dsh-pet-7340/thumb/<素材根>/<名字>.webm`），所以名字必须是
        该宠物 `animations` 配置里菜单能点到的名字之一——播放端对不存在的名字没有兜底
        （404 → 加载失败 → 表现为"点了没反应"），因此由宿主在写入前拦下。

        **校验**（任何一条不通过都返回 HTTP 200 + `ok: false`）：

        - `name` 必填，`trim()` 后不得为空，且必须在该宠物的动画池内；
        - `pet` 必须是一只真实存在的桌宠；缺省时落到当前桌宠，仍为空则兜底 `main`。

        **多宠物：动画池是按「条目」分的，不是全局一份**

        主配置里的宠物共用 `main` 条目的池；`pet/<名>-config.json` 定义的每个种类各用自己
        文件里的 `animations`（同种类的多只实例共享同一份池）。所以"这只宠物能点播什么"必须
        按它所属的条目取——**拿主宠物的名字去点播 pet pack 宠物必然 `unknown-animation`**：

        1. `GET /config` → 顶层每个键是一个条目（`main`、`test1`…），条目下的 `pets[]` 是它的实例；
        2. 按 `?pet=` 的 id 找到它属于哪个条目；
        3. 该条目的 `animations` 就是这只宠物的可点播集合（`idle` / `turn` / `drag` / `clicks` /
           `moves.actions` / `categories` / `events` 七类池子的并集，去重后与右键菜单一致）。

        另外 **pet pack 的素材是独占的**（`pet/<素材根>-animation/`，不回落主素材池）：名字还得
        真实存在于该目录里，否则宿主会放行（校验只看池），但播放端取素材 404，表现为"点了没反应"。

        **注意**：`once` 语义是"插播一段"——播完会回到正常的动画链（与菜单点一下相同）。
        另外同一个动画连续点播两次：`counter` 会递增，正常情况下会重播；但若第二次落在
        播放端上一次切换尚未就绪的窗口内，可能被其防重逻辑吞掉（表现为只播一次）。
      parameters:
        - name: pet
          in: query
          required: false
          description: |
            目标桌宠 id。缺省时落到当前桌宠；仍无法确定时兜底 `main`。
            指定的 id 不存在 → `ok: false` + `reason: unknown-pet`。
            **多宠物时建议显式传**——缺省落到的是"当前桌宠"，未必是你要点播的那只；
            而名字必须在**这只宠物所属条目**的动画池内（见上）。
          schema:
            type: string
          example: main
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name:
                  type: string
                  description: |
                    要播放的动画名。必须是该宠物 `animations` 配置里菜单可点到的名字
                    （`idle` / `turn` / `drag` / `clicks` / `moves.actions` / `categories` /
                    `events` 这七类池子的并集），否则 `ok: false` + `reason: unknown-animation`。
                  example: 东张西望
            examples:
              turn:
                summary: 播一段转向动画
                value:
                  name: 东张西望
              move:
                summary: 播一段移动动画（会真的走过去，与菜单一致）
                value:
                  name: 螃蟹走路
      responses:
        "200":
          description: |
            恒为 200（除 405/400）。失败通过 `ok: false` 表达，`reason` 可能是
            `bad-request`（名字为空）、`unknown-pet`、`unknown-animation`、
            `generate-error`（配置不可读等）。
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/OkResponse"
                  - $ref: "#/components/schemas/FailureResponse"
        "400":
          description: '请求体不是合法 JSON（`{ "error": "invalid JSON body" }`）'
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"

  /dsh-pet-7340/chat:
    get:
      tags: [Action]
      operationId: getChatMemory
      summary: 读取最近对话记忆窗口
      description: |
        返回该宠物的最近若干轮对话（**一次性读取，不是轮询**），供对话弹窗打开时回填历史。

        记忆的唯一读写方是宿主（落盘在 `memory.json`），浏览器与桌面两端都只是客户端，
        因此同一 DSH 实例下的两端**天然共享同一份记忆**。文件全量保留、不删除，
        只是响应时按 `chatMemoryRounds`（默认 5 轮，1 轮 = 1 问 1 答）截取尾部。
      parameters:
        - $ref: "#/components/parameters/PetIdQuery"
      responses:
        "200":
          description: 最近窗口
          content:
            application/json:
              schema:
                type: object
                required: [ok, messages, rounds]
                properties:
                  ok:
                    type: boolean
                    const: true
                  messages:
                    type: array
                    description: 按时间正序排列的消息，最多 `rounds * 2` 条
                    items:
                      $ref: "#/components/schemas/ChatMemoryMessage"
                  rounds:
                    type: integer
                    description: 该宠物当前生效的轮数（来自配置 `chatMemoryRounds`）
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "500":
          $ref: "#/components/responses/InternalError"
    post:
      tags: [Action]
      operationId: sendChat
      summary: 对指定宠物说一句话并生成回复
      description: |
        携带历史上下文生成回复，把「问 + 答」写入记忆，并把回复写进 `pets.<id>.say`。
        这是动作端点，**只回 `{ ok: true }`**——回复文本从 `/state` 读。

        调用方收到 `ok` 后应立刻拉一拍 `/state` 即可看到回复，无需额外等待。

        - 文本会 `trim()`，空文本 → `{ ok: false, reason: 'bad-request' }`。
        - 文本超过 **2000 字** → `{ ok: false, reason: 'bad-request' }`。
        - 模型选择：条目配置的 `chatModel` 优先；留空则跟随当前对话的模型。
          指定模型生成失败时会**自动回落到当前对话的模型**重试一次。
        - 记忆只存**正文**：配图属展示层，不进上下文（否则下次请求会把标记当历史读回去）。
      parameters:
        - $ref: "#/components/parameters/PetIdQuery"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [text]
              properties:
                text:
                  type: string
                  maxLength: 2000
                  description: 用户消息正文
            examples:
              hello:
                summary: 打个招呼
                value:
                  text: 今天过得怎么样？
      responses:
        "200":
          description: |
            恒为 200（除 405）。`reason` 取值：`bad-request`（空/超长消息）、
            `provider-missing`（没有可用的对话服务商）、`generate-error`（生成/IO 失败）。
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/OkResponse"
                  - $ref: "#/components/schemas/FailureResponse"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"

  /dsh-pet-7340/config:
    get:
      tags: [Config]
      operationId: getConfig
      summary: 读取合并后的成品配置
      description: |
        返回**合并成品**：内置默认（`assets/config.jsonc`）与用户层
        （`$DSH_HOME/dsh-pet/main-config.jsonc`）深度合并后的结果，
        每个条目的字段都已填满（动画池、权重、物理参数、工作状态文案等），
        浏览器/桌面/设置页直接消费，**无需任何校验或兜底**。

        顶层键是"条目名"（`main`、`test1`……），不是数组。

        **一个条目 = 一个「种类」**：动画池（`animations`）、播放权重、人设（`whisperPrompt`）、
        表情包（`memes`）、模型等都属于条目，条目下的 `pets[]` 是它的实例——同种类的多只共享
        同一份池与素材。所以"某只宠物能播什么动画 / 能配哪张表情包"要**先按它的 id 找到所属条目**
        再取：`main` 条目由内置默认 + 用户层合并而来，`pet/<名>-config.json` 的条目由该种类文件
        覆盖。没有一份对所有宠物生效的全局动画池。
      responses:
        "200":
          description: 成品配置（顶层为条目名 → 该条目配置对象）
          content:
            application/json:
              schema:
                type: object
                additionalProperties:
                  $ref: "#/components/schemas/PetConfigEntry"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "500":
          description: 配置文件损坏或读取失败
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    put:
      tags: [Config]
      operationId: saveConfig
      summary: 保存用户层配置
      description: |
        对用户层做**白名单重建**后写盘，随后返回保存后的成品聚合（与 `GET /config` 同一份）。

        有以下几点必须知道：

        - **只白名单字段会被保留**：`pets[]` 的 `id`/`name`/`size`/`balanceEnabled`/
          `whisperEnabled`/`workStatusEnabled`/`fixedEnabled`/`display`/`position`，以及顶层
          `notificationsEnabled`/`whisperImageEnabled`/`chatImageEnabled`/`confineToScreen`/
          `physics`/`whisperModel`/`chatModel`/`chatMemoryRounds`/`chatImageLimit`。
          其余字段会沿用磁盘上用户文件里的原值（透传保留），所以设置页保存
          **不会抹掉**你手写的精调配置（`whisperPrompt`/`memes`/`eventsRefreshSec` 等）。
          白名单字段也只在请求体**真的传了**时才算白名单：没传就走透传，不会被抹成默认值。
        - 用户层文件**存在但连 JSONC 都解析不了**（真损坏）时，默认**先不写盘**，
          返回 `409` 让调用方确认——因为白名单重建会把文件里剩下的内容整份丢掉且静默。
          确认要重建时加 `?force=1`。
        - 保存成功后宿主会**异步**重启桌面 Helper（`display`/`size` 等可能变化），
          不阻塞响应。
      parameters:
        - name: force
          in: query
          required: false
          description: 置 `1` 时跳过"用户层不可解析"的预检，强行重建并写盘
          schema:
            type: string
            enum: ["1"]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SaveConfigRequest"
            examples:
              singlePet:
                summary: 保存一只宠物
                value:
                  pets:
                    - id: main
                      name: 蓝毛小女仆
                      size: 462
                      balanceEnabled: true
                      whisperEnabled: true
                      workStatusEnabled: true
                      fixedEnabled: false
                      display: both
                      position:
                        corner: bottom-right
                        marginX: 24
                        marginY: 24
                  notificationsEnabled: true
                  whisperImageEnabled: true
                  chatImageEnabled: true
      responses:
        "200":
          description: 保存成功，返回保存后的成品聚合
          content:
            application/json:
              schema:
                type: object
                additionalProperties:
                  $ref: "#/components/schemas/PetConfigEntry"
        "400":
          description: |
            请求体非法。可能是 JSON 解析失败（`invalid JSON body`），
            或字段校验不通过（`invalid pet config`：`id` 为空/超 64 字/含文件名非法字符、
            `size` 非正数、`balanceEnabled` 非布尔、`display` 不在枚举内、
            `position.corner` 不在枚举内、`marginX`/`marginY` 非数字等）。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "409":
          description: |
            用户层配置损坏且未带 `?force=1`。调用方应弹窗询问用户，
            取消则不动文件，确认后带 `?force=1` 重试。
          content:
            application/json:
              schema:
                type: object
                required: [error, needConfirm, userFile]
                properties:
                  error:
                    type: string
                    const: user config is unparsable
                  needConfirm:
                    type: boolean
                    const: true
                  userFile:
                    type: string
                    description: 损坏的用户配置文件绝对路径
    post:
      tags: [Config]
      operationId: syncConfigFromDefault
      summary: 用内置默认覆盖用户层配置
      description: |
        把包内 `assets/config.jsonc` 的**原文（含注释）**整份写入用户配置文件。
        这既是「恢复默认」，也顺便给用户留下一份可直接编辑的完整配置，
        不必再自己从包内复制一份。

        写盘后异步重启桌面 Helper，并返回新的成品聚合。
      responses:
        "200":
          description: 同步成功，返回新的成品聚合
          content:
            application/json:
              schema:
                type: object
                additionalProperties:
                  $ref: "#/components/schemas/PetConfigEntry"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "500":
          description: 内置默认文件缺失，或用户目录不可写（绝不静默留下半个配置文件）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /dsh-pet-7340/pet-display:
    post:
      tags: [Config]
      operationId: setPetDisplay
      summary: 改单只宠物的显示位置
      description: |
        按宠物 id 改它的 `display`，并返回改动后的成品聚合（与 `GET /config` 同一份）。

        这是 `PUT /config` 的**单只快捷形式**：调用方不必回传整段 `pets[]`（那既容易误伤同层
        其它宠物，也要自己判断该写哪一层）。桌面端与浏览器端的右键菜单「显示位置」都走它。

        **层归属由宿主反查，调用方不要传**：`id` 在合并后是**全局唯一**的（`mergePet` 会跳过
        重复实例），宿主用 `findPetInstance` 定位后按条目归属决定写哪个文件——`main` 条目写
        `$DSH_HOME/dsh-pet/main-config.jsonc`，文件宠物写 `pet/<前缀>-config.json`（`.jsonc` 同样支持）。

        写入语义与 `PUT /config` 一致：白名单重建 + 磁盘原值透传（不抹掉手写的精调字段）。
        写盘后同样**异步**重启桌面 Helper、不阻塞响应——响应可能来不及送达（发起者往往就是
        即将被换掉的那个桌面 Helper 进程），调用方按 fire-and-forget 处理即可。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [id, display]
              properties:
                id:
                  type: string
                  description: 宠物实例 id（合并后全局唯一）
                display:
                  type: string
                  enum: [web, desktop, both, none]
                  description: |
                    目标显示位置：`web` 仅网页 / `desktop` 仅桌面 / `both` 两者 / `none` 都不显示。
                    选 `none` 后这只宠物两端都不可见，恢复入口是设置页的「显示位置」下拉框。
            examples:
              toWeb:
                summary: 从桌面撤下，保留在网页
                value:
                  id: main
                  display: web
      responses:
        "200":
          description: 改动成功，返回改动后的成品聚合
          content:
            application/json:
              schema:
                type: object
                additionalProperties:
                  $ref: "#/components/schemas/PetConfigEntry"
        "400":
          description: |
            请求体非法：JSON 解析失败（`invalid JSON body`）、缺 `id`（`missing pet id`）、
            或 `display` 不在枚举内（`invalid display: xxx`）。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: |
            找不到该宠物（`pet not found: xxx`）。该实例因 `id` 与其它条目重复而在合并时被跳过时
            也走这里——那种情况下它在成品聚合里根本不存在，宿主不会去猜它属于哪个文件。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "500":
          description: 配置读取失败（安装损坏）或写盘失败
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /dsh-pet-7340/config/meta:
    get:
      tags: [Config]
      operationId: getConfigMeta
      summary: 配置文件路径与存储位置清单
      description: |
        设置页「高级配置」与「卸载与存储」区块的展示数据源：
        告诉你配置和各类数据到底落在哪，以及卸载命令该用哪个 profile。
      responses:
        "200":
          description: 路径清单
          content:
            application/json:
              schema:
                type: object
                required: [user, default, animations, storage, profile]
                properties:
                  user:
                    type: string
                    description: 用户层配置文件绝对路径
                  default:
                    type: string
                    description: 包内内置默认配置绝对路径
                  animations:
                    type: string
                    description: 用户动画素材根目录绝对路径
                  storage:
                    type: array
                    description: 全部落盘位置（用户数据 / Electron 运行时 / 桌面端缓存 / 下载缓存 / 插件本体）
                    items:
                      $ref: "#/components/schemas/StorageEntry"
                  profile:
                    type: string
                    description: |
                      DSH profile 名，用于拼接卸载命令
                      `dsh plugin --profile <名> remove dsh-pet`。反推不出时为空串。

  /dsh-pet-7340/models:
    get:
      tags: [Config]
      operationId: listModels
      summary: 列出可选服务商与模型
      description: |
        设置页「AI 模型」下拉框的数据源，与 DSH 自己的模型选择器**同源**——
        都来自宿主 `llm` 服务：`listProviders()` 是已注册的实时服务商路由，
        `listModels(provider)` 是该路由下的模型。

        - 只读、无副作用。
        - 某个服务商列模型失败（适配器不支持 / 网络问题）只让它 `models` 为空数组，
          **不拖垮整张清单**。
        - 一个服务商路由都没注册时，回落到 `listConfigurableProviders()`
          （适配器声明可配置的路由），免得下拉框空着。
        - 服务商/模型的 `name` 缺失时回落为 `id`。
      responses:
        "200":
          description: 服务商与模型清单
          content:
            application/json:
              schema:
                type: object
                required: [providers]
                properties:
                  providers:
                    type: array
                    items:
                      $ref: "#/components/schemas/Provider"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "500":
          description: 读取服务商清单失败
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /dsh-pet-7340/reload:
    post:
      tags: [Action]
      operationId: reload
      summary: 重载桌面端（重启 Helper）
      description: |
        重启桌面 Helper 进程，全部桌面宠物窗口按最新配置重建。
        与保存配置走**同一条**重启路径（串行队列 + 等旧进程真正退出再起新的），
        因此宠物数量 / `display` / `size` 的变化同样生效。

        **注意**：发起者通常就是即将被重启的那个 Helper，本响应不保证送达。
        因此实现上不等待重启完成，立刻返回 `200`。
      responses:
        "200":
          description: 已排入重启队列
          content:
            application/json:
              schema:
                type: object
                required: [reloading]
                properties:
                  reloading:
                    type: boolean
                    const: true
        "405":
          $ref: "#/components/responses/MethodNotAllowed"

  "/dsh-pet-7340/thumb/{petId}/{file}":
    get:
      tags: [Assets]
      operationId: getAnimation
      summary: 获取宠物动画素材
      description: |-
        按「是否存在该宠物的独立素材目录 `pet/<petId>-animation/`」决定素材归属：

        - **存在**（pet pack 宠物）：只查该目录，查不到即 `404` 显式报错——**绝不混用**别的素材。
        - **不存在**（所有主配置宠物，包括用户添加的任意多只）：走主素材链——
          用户目录 `main-animation/<webm|mov>` 优先，其次包内 `assets/<webm|mov>`。
          与宠物数量无关，多只共用。

        `petId` 是**标识符**（即 `<名>-animation` 里的 `<名>`），不是路径片段：
        含分隔符 / 保留字符即 `400`，早于任何路径拼接判定。合法名（含中文）照常。
      parameters:
        - name: petId
          in: path
          required: true
          description: 素材根标识符（pet pack 宠物为 `<名>`，主宠物传 `main`）
          schema:
            type: string
        - name: file
          in: path
          required: true
          description: 动画文件名（可含子路径）。**扩展名必须是 `.webm` 或 `.mov`**
          schema:
            type: string
      responses:
        "200":
          description: 动画文件
          content:
            video/webm:
              schema:
                type: string
                format: binary
            video/quicktime:
              schema:
                type: string
                format: binary
        "400":
          description: |
            `petId` 含非法字符；或扩展名不是 `.webm`/`.mov`
            （`unsupported animation format`）；或路径段数不对。
          content:
            text/plain:
              schema:
                type: string
        "404":
          description: "素材不存在（`dsh-pet: asset not found`）"
          content:
            text/plain:
              schema:
                type: string

  "/dsh-pet-7340/font/{file}":
    get:
      tags: [Assets]
      operationId: getFont
      summary: 获取字体文件
      description: 从包内 `assets/fonts/` 读取（扁平结构，**没有** petId 段）。
      parameters:
        - $ref: "#/components/parameters/AssetFile"
      responses:
        "200":
          description: 字体文件
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        "404":
          description: "字体不存在（`dsh-pet: font not found`）"
          content:
            text/plain:
              schema:
                type: string

  "/dsh-pet-7340/pic/{file}":
    get:
      tags: [Assets]
      operationId: getPic
      summary: 获取通知图标 / 表情包
      description: |
        静态图，两种形式：

        - `/dsh-pet-7340/pic/<名>.png` → **包内** `assets/pic/`（方形 png，系统通知图标用）。
        - `/dsh-pet-7340/pic/memes/<素材根>/<名>.png` → 表情包（碎碎念/对话配图用的图），
          按素材根决定**素材归属**，与动画（`/thumb`）同一套语义：
          1. `pet/<素材根>-memes/` 存在（种类自带表情包）：**只查该目录**，查不到即 `404` 显式报错，
             **绝不回落**别的目录；
          2. 不存在：用户目录 `$DSH_HOME/dsh-pet/memes/` 优先，其次包内 `assets/memes/`（逐文件合并，
             与 `main-animation/<ext> → 包内 assets/<ext>` 的主素材链同构）。

          素材根 = 该宠物的条目 key（`assetRoot`：主配置宠物为 `main`，文件宠物为配置文件前缀）。
          旧的两段形式 `/dsh-pet-7340/pic/memes/<名>.png` 仍然可用，等价于素材根 `main` 的回落链
          （未升级的客户端照常取到包内表情包）。

          `素材根` 是**标识符**（不是路径片段）：含分隔符 / 保留字符即 `400`，早于任何路径拼接判定。
          表情包名称即文件名（不含子目录），两者共用同一份防穿越校验。
      parameters:
        - $ref: "#/components/parameters/AssetFile"
      responses:
        "200":
          description: 图片文件
          content:
            image/png:
              schema:
                type: string
                format: binary
            image/jpeg:
              schema:
                type: string
                format: binary
            image/webp:
              schema:
                type: string
                format: binary
            image/gif:
              schema:
                type: string
                format: binary
        "400":
          description: "素材根含非法字符（`dsh-pet: invalid asset root`）"
          content:
            text/plain:
              schema:
                type: string
        "404":
          description: "图片不存在（`dsh-pet: pic not found`）"
          content:
            text/plain:
              schema:
                type: string

  # ---------- 宿主无关网关（T07） ----------

  "/dsh-pet-7340/capabilities":
    get:
      tags: [Gateway]
      operationId: getCapabilities
      summary: 桌宠能力自述（L0 在场）
      description: |
        自报「我是谁、我能干什么、哪些端点在哪一档」。任何 agent 不用试错就能判断碎碎念能不能用、
        凭证在不在、会话事件从哪来（`hostCapabilities` 的三个枚举值就是回答这件事）。

        - `mode`：`standalone`（独立模式）/ `dsh`（DSH 插件模式）；
        - `hostCapabilities.credentials`：`none` / `dsh`（DSH 凭证库）/ `local-file`（relays 目录的 0600 文件）；
        - `hostCapabilities.sessionEvents`：`none` / `dsh`（DSH 会话事件在场，此时 `POST /events` 的 status 段被忽略）/ `http`；
        - `instanceId` 与发现文件（`<DSH_HOME>/dsh-pet/gateways/<pid>.json`）里的同名，供复核；
        - **不返回任何凭证或配置值**，只报能力在场与否。
      responses:
        "200":
          description: 能力与档位表
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CapabilitiesPayload"

  "/dsh-pet-7340/agents":
    get:
      tags: [Gateway]
      operationId: listAgents
      summary: 在场 agent 列表（L1 只读）
      description: |
        当前在 TTL 内（60s）的 agent。过期条目自动滤除（读时清理，不另起定时器）；
        进程重启即空——在场信息本就是易失的，下一个心跳周期自然恢复。
      responses:
        "200":
          description: 在场列表（按 agentId 排序）
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                  agents:
                    type: array
                    items:
                      $ref: "#/components/schemas/AgentView"

  "/dsh-pet-7340/agents/hello":
    post:
      tags: [Gateway]
      operationId: agentHello
      summary: 登记在场 / 心跳续期（L0 在场）
      description: |
        第一次调用 = 登记；之后每 ≤60s 重复调用同一端点 = 心跳续期（`leaseId` 不变）。
        **不落盘、不鉴权**：服务端只维护进程内 Map。`instanceId` / `capabilities` 分别是
        `agentId` / `wants` 的别名（发现文件里的字段名，两种都收）。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                agentId:
                  type: string
                  description: agent 标识（必填；也可用别名 instanceId）
                instanceId:
                  type: string
                  description: agentId 的别名
                kind:
                  type: string
                wants:
                  type: array
                  items:
                    type: string
                capabilities:
                  type: array
                  description: wants 的别名
                  items:
                    type: string
      responses:
        "200":
          description: 登记成功（leaseId + ttlSec + granted）
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                  leaseId:
                    type: string
                  ttlSec:
                    type: integer
                  granted:
                    type: array
                    items:
                      type: string
        "400":
          description: agentId 缺失或过长（限 128 字符）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  "/dsh-pet-7340/events":
    post:
      tags: [Gateway]
      operationId: postEvents
      summary: 事件摄入（L2 驱动）：气泡 + 六档工作状态
      description: |
        一个 curl 就能接入任意 agent（HTTP 摄入主轨）。字段形状**借自 ACP 的 notice/severity/coalesce 语义**，
        但不实现 ACP 协议。写入复用既有叶子：`notice` → `pets.<id>.say`（与 /broadcast 同一条；
        客户端 1s 轮询后弹气泡），`status` → `sections.workStatus`（合成会话 `http:<agentId>`）。
        **不新造状态通道。**

        互斥规则：`/capabilities` 的 `hostCapabilities.sessionEvents === 'dsh'` 时（DSH 会话事件在场），
        `status` 段被忽略，只处理 `notice`——避免六档被两个源同时改写而抖动。**`task` 与 `status`
        同段同开关**（它俩挂同一条合成会话条目，只放一个会造出「DSH 档位配 HTTP 文案」的拼接态）。

        coalesce：同 `coalesceKey` 在 5s 窗口内、且优先级未升级 → 静默合并（不重复弹）；
        `error` 永远能穿透 `warning` 的合并窗口（告警升级不该被吞）。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [agentId]
              properties:
                agentId:
                  type: string
                  description: 事件来源 agent（限 128 字符）
                sessionId:
                  type: string
                  description: 可选的会话标识（当前仅记录，不参与路由）
                notice:
                  type: object
                  required: [severity, text]
                  properties:
                    severity:
                      type: string
                      enum: [info, warning, error]
                      description: "info→priority 0 / warning→10 / error→20"
                    text:
                      type: string
                      description: "气泡文本（≤500 码点，超长 400，不静默截断）"
                    coalesceKey:
                      type: string
                      description: 去重键（同键 5s 窗口内不重复弹）
                    ttlMs:
                      type: integer
                      description: "气泡存留毫秒（1..60000；R0 仅校验，不驱动过期）"
                status:
                  type: string
                  enum: [idle, thinking, working, waiting-approval, done, error]
                  description: "六档驱动；idle = 清会话回空闲"
                task:
                  type: string
                  description: |
                    任务详情（与 `status` 同段；≤40 码点，超长 400，不静默截断）。
                    落在同一合成会话 `http:<agentId>` 的条目上，随会话同生共死；
                    `status:idle` 时不要带（会被清掉，显式 400）。
                petId:
                  type: string
                  description: 气泡目标宠物（缺省 = 当前桌宠）
      responses:
        "200":
          description: |
            动作结果（HTTP 恒 200，失败走 `ok:false`）：`no-active-pet` 没有可显示的桌宠；
            `ingest-error` 写状态失败（message 带原因）。
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/OkResponse"
                  - $ref: "#/components/schemas/FailureResponse"
        "400":
          description: 结构错（缺 agentId / 坏 severity / 空文本 / 超长 / 未知 status）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  "/dsh-pet-7340/state/stream":
    get:
      tags: [Gateway]
      operationId: streamState
      summary: 状态流（SSE，opt-in，L1 只读）
      description: |
        `GET /state` 的推送版：`text/event-stream`，帧格式 `id: <maxCounter>` + `event: state|snapshot`
        + `data: <完整 /state JSON>`。50ms 去抖（一次请求连写多片只发一帧）、连接上限 8（超出 429）、
        25s 心跳注释行、`Last-Event-ID` 只用于去重（**不重放历史**）。

        **轮询契约不动**：`GET /state` 仍是唯一事实源，SSE 只是加速通道，断了不影响正确性。
        只能走 HTTP 直连——桌面 bridge 管道不支持流式，经 bridge 访问会得到 501。
      responses:
        "200":
          description: SSE 流（首帧即当前快照）
          content:
            text/event-stream:
              schema:
                type: string
        "429":
          description: 连接数已达上限（8）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  # ---------- 中转站管理（/relays 子域） ----------

  "/dsh-pet-7340/relays":
    get:
      tags: [Relays]
      operationId: listRelaySites
      summary: 全部站点的脱敏视图
      description: |
        返回全部站点 + 脱敏后的凭证摘要（`credential.masked`，形如 `sk-ab****wxyz`）。
        **响应体绝不含凭证明文**——每个响应返回前过脱敏自检，检出明文该请求直接失败。
      responses:
        "200":
          description: 站点视图数组（按名称排序，结果稳定）
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                  sites:
                    type: array
                    items:
                      $ref: "#/components/schemas/RelaySiteView"
    post:
      tags: [Relays]
      operationId: createRelaySite
      summary: 新建站点（可同时写入凭证）
      description: |
        body = 站点字段 + 可选 `credential` 段。凭证与站点**分文件存储**：
        站点文件（`relays.json`）没有任何密钥字段，凭证只进 `relay-credentials.json`。
        建站时换算率未显式确认 → 写默认值 500000 且标记未确认（余额带 `rateUnconfirmed`，
        不参与告警）——**绝不静默默认**。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RelaySiteInput"
      responses:
        "200":
          description: 新建站点的脱敏视图
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                  site:
                    $ref: "#/components/schemas/RelaySiteView"
        "400":
          description: 结构性参数错误（坏 JSON / 缺字段 / 非法字段）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  "/dsh-pet-7340/relays/{id}":
    parameters:
      - $ref: "#/components/parameters/RelaySiteId"
    put:
      tags: [Relays]
      operationId: updateRelaySite
      summary: 更新站点（可同时更新/清除凭证）
      description: |
        body 同新建；`credential` 段缺省 = 不动，显式 `null` = 清除，对象 = 校验后写入。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RelaySiteInput"
      responses:
        "200":
          description: 更新后的脱敏视图
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                  site:
                    $ref: "#/components/schemas/RelaySiteView"
        "400":
          description: 结构性参数错误（坏 JSON / 缺字段 / 非法字段）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: 站点不存在（`site not found`）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      tags: [Relays]
      operationId: deleteRelaySite
      summary: 删站点并删凭证
      description: 站点与凭证一起删（不留孤儿密钥文件）。
      responses:
        "200":
          description: 删除后剩余站点的脱敏视图
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                  sites:
                    type: array
                    items:
                      $ref: "#/components/schemas/RelaySiteView"
        "404":
          description: 站点不存在（`site not found`）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  "/dsh-pet-7340/relays/refresh-all":
    post:
      tags: [Relays]
      operationId: refreshAllRelays
      summary: 并发刷新全部启用站点
      description: |
        并发度 4（中转站多为小站，保守）；默认 4s 舰队 deadline，到点未开始的站显式跳过
        （下周期重试）；连续失败的站进入指数退避（1s→2s→4s…封顶 60s），退避期内不发起请求。
      responses:
        "200":
          description: 各站结果数组（顺序与入站顺序一致）
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/RelayBalanceResult"

  "/dsh-pet-7340/relays/{id}/refresh":
    parameters:
      - $ref: "#/components/parameters/RelaySiteId"
    post:
      tags: [Relays]
      operationId: refreshRelaySite
      summary: 刷新该站余额
      description: |
        取数链路按凭证类型分流（凭证类型之间**不自动降级**）：
        `api-key` → `/api/usage/token/` → billing 双端点；`access-token` → `/api/user/self`
        → `/api/usage/token/` → billing。失败时：有手工值回退手工（标注来源），否则报错。
        **绝不伪造 0 余额。**
      responses:
        "200":
          description: 该站余额结果（六种 reason，见 RelayBalanceResult）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RelayBalanceResult"
        "404":
          description: 站点不存在（`site not found`）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  "/dsh-pet-7340/relays/{id}/health":
    parameters:
      - $ref: "#/components/parameters/RelaySiteId"
    post:
      tags: [Relays]
      operationId: checkRelayHealth
      summary: 连通性探测
      description: |
        低开销探测（new-api 系打 `/api/status`，免鉴权），区分
        `online` / `unreachable` / `auth-failed`（401/403）/ `blocked` / `unknown`。
        没有探测实现的站点类型（如 openai-compat）返回 `unknown` + 原因，不假装探了。
      responses:
        "200":
          description: 探测结果
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RelayHealthResult"
        "404":
          description: 站点不存在（`site not found`）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  "/dsh-pet-7340/relays/{id}/manual-balance":
    parameters:
      - $ref: "#/components/parameters/RelaySiteId"
    post:
      tags: [Relays]
      operationId: setRelayManualBalance
      summary: 设置/清除手工余额（降级路径）
      description: |
        自动查询失败时允许用户手工填写余额并标记「手工」。空 `amount` = 清除（撤销降级）。
        手工值在界面上必须带「手工」标签与填写时间，不得伪装成实时数据；不参与自动刷新覆盖。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                amount:
                  type: string
                  description: "非负金额（至多两位小数）；空串 = 清除"
                currency:
                  type: string
                  description: "币种（统一大写，如 USD / CNY）"
      responses:
        "200":
          description: 设置后的脱敏视图
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                  site:
                    $ref: "#/components/schemas/RelaySiteView"
        "400":
          description: 结构性参数错误（坏 JSON / 缺字段 / 非法字段）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: 站点不存在（`site not found`）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  "/dsh-pet-7340/relays/detect":
    post:
      tags: [Relays]
      operationId: detectRelayKind
      summary: 站点类型识别（不落库）
      description: |
        body = `{ url, credential? }`。探 `/api/status`（免鉴权）拿 new-api 特征字段，
        有凭证再探 `/v1/models` 拿 `supported_endpoint_types` 强信号；返回
        `{ kind, confidence, evidence[], suggestedQuotaPerUnit?, displayInCurrency? }`。
        识别依据**只信特征字段**——`system_name` 会被站长自定义、`version` 可能为空，
        两者都不可用于判类型（真站实测结论）。
        凭证只用于本次探测，**不写盘**；探测失败返回 `kind: 'unknown'` + 原因，
        引导调用方手动选择类型或手工填余额（不静默失败）。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [url]
              properties:
                url:
                  type: string
                credential:
                  $ref: "#/components/schemas/RelayCredentialInput"
      responses:
        "200":
          description: 识别结果（失败也是 200 + unknown，由调用方决定下一步）
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                  detect:
                    $ref: "#/components/schemas/RelayDetectResult"

  "/dsh-pet-7340/relays/models":
    get:
      tags: [Relays]
      operationId: getRelayModelMatrix
      summary: 模型清单矩阵（只读缓存聚合）
      description: |
        聚合各站已缓存的模型清单成矩阵：行 = 模型（并集，按 id 排序），格子三态——
        `available: true`（该站有）/ `false`（抓过且没有，明确不可用）/ `null`（未抓过，未知）。
        **只读缓存、不外发抓取**：实时抓取走 `POST /relays/{id}/models`（要带凭证，太重，
        不进周期刷新）。`unknownSiteCount` = 从未抓过的站点数。
      responses:
        "200":
          description: 模型矩阵
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                  rows:
                    type: array
                    items:
                      $ref: "#/components/schemas/RelayModelRow"
                  unknownSiteCount:
                    type: integer

  "/dsh-pet-7340/relays/{id}/models":
    parameters:
      - $ref: "#/components/parameters/RelaySiteId"
    post:
      tags: [Relays]
      operationId: fetchRelayModels
      summary: 实时抓取该站模型清单并写缓存
      description: |
        优先 `/api/pricing`（免鉴权、带 `model_ratio` / `model_price` 倍率——比价原料），
        失败回落 `/v1/models`（只有 id）。被拦截 / 被限流不回落，直接按分类报错。
      responses:
        "200":
          description: 抓取结果（source = pricing / models）
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                  siteId:
                    type: string
                  source:
                    type: string
                    enum: [pricing, models]
                  models:
                    type: array
                    items:
                      $ref: "#/components/schemas/RelayModelEntry"
                  fetchedAt:
                    type: string
                    format: date-time
        "404":
          description: 站点不存在（`site not found`）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  "/dsh-pet-7340/relays/focus":
    post:
      tags: [Relays]
      operationId: setRelayFocus
      summary: 设置/清除焦点站点
      description: |
        焦点站点 = 当前用于展示余额/健康的站点（存 `focus.json`，不进站点实体）。
        **只影响展示口径，绝不做请求转发**（明确 Non-Goal）。空 `siteId` = 清除焦点
        （回到全舰队汇总口径）。切换后立即重刷 `sections.relays` 状态叶。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                siteId:
                  type: string
                  description: "站点 id；空串/缺失 = 清除焦点"
      responses:
        "200":
          description: 当前焦点站点 id（null = 无焦点）
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                  focusSiteId:
                    type: [string, "null"]
        "404":
          description: 站点不存在（`site not found`）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

components:
  parameters:
    RelaySiteId:
      name: id
      in: path
      required: true
      description: 站点 id（服务端 `randomUUID()` 生成）
      schema:
        type: string

    PetIdQuery:
      name: pet
      in: query
      required: true
      description: |
        目标宠物 id（配置里 `pets[].id`，默认 `main`）。
        允许包含点号与中文；**不要**按 `.` 解析由 `/state` 返回的路径键来取它。
      schema:
        type: string
      example: main

    AssetFile:
      name: file
      in: path
      required: true
      description: |
        文件名，可含子目录。表情包为 `memes/<素材根>/<名>.png`（旧形式 `memes/<名>.png` 亦可），
        通知图标为 `<名>.png`。
      schema:
        type: string

  responses:
    MethodNotAllowed:
      description: '该方法不被支持（`{ "error": "method not allowed" }`）'
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

    InternalError:
      description: 宿主内部错误
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

  schemas:
    OkResponse:
      type: object
      required: [ok]
      properties:
        ok:
          type: boolean
          const: true
      description: 动作已完成。数据请从 `GET /state` 读取。

    FailureResponse:
      type: object
      required: [ok, reason]
      properties:
        ok:
          type: boolean
          const: false
        reason:
          type: string
          description: |
            失败原因分类。`bad-request` 参数不合法（空文本/超长）、`provider-missing` 没有可用
            的对话服务商、`generate-error` 生成或 IO 失败、`unknown-pet` 指定的桌宠不存在、
            `unknown-image` 配图不在包内表情包池内。
          enum: [bad-request, provider-missing, generate-error, unknown-pet, unknown-image, unknown-animation]
        message:
          type: string
          description: 人类可读的补充说明（可选）

    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: string

    PollState:
      type: object
      required: [sections, pets]
      description: |
        统一状态 S。每个叶子都是 `{ counter, data }`；`counter` 变化即表示该叶子更新了。
        `configVersion` 是顶层附带字段，**不是叶子**（没有 counter/data，不参与比对）。
      properties:
        configVersion:
          type: string
          description: |
            配置版本指纹（参与合并的全部配置文件 mtime 的最大值，毫秒时间戳的字符串形式；
            文件都不存在时为 `"0"`）。与上一拍不同即表示配置被改过——桌面端右键改显示位置、
            另一个页面保存、或用户手工编辑 `main-config.jsonc` / `pet/*.json`——
            消费端应重拉 `GET /config`。老版本宿主不带该字段，消费端按"无从判断"处理。
        sections:
          type: object
          description: 全局段（所有端共享一份）
          required: [balance, workStatus, notify, relays, agents]
          properties:
            balance:
              $ref: "#/components/schemas/BalanceLeaf"
            workStatus:
              $ref: "#/components/schemas/WorkStatusLeaf"
            notify:
              $ref: "#/components/schemas/NotifyLeaf"
            relays:
              $ref: "#/components/schemas/RelayLeaf"
            agents:
              $ref: "#/components/schemas/AgentsLeaf"
        pets:
          type: object
          description: 每只宠物各自一份；键是宠物 id（**可含点号，勿切分**）
          additionalProperties:
            type: object
            properties:
              say:
                $ref: "#/components/schemas/SayLeaf"
              anim:
                $ref: "#/components/schemas/AnimLeaf"
      examples:
        typical:
          summary: 一只有余额与碎碎念的宠物
          value:
            sections:
              balance:
                counter: 1755000000000
                data:
                  ok: true
                  provider: deepseek
                  kind: deepseek
                  data:
                    currency: CNY
                    total: "42.00"
                    granted: "10.00"
                    toppedUp: "32.00"
              workStatus:
                counter: 1755000000100
                data:
                  state: working
                  task: 正在读取 src/host/index.ts
              notify:
                counter: 1755000000200
                data:
                  type: session/event
                  event:
                    type: turn/end
                    data:
                      reason:
                        kind: completed
            pets:
              main:
                say:
                  counter: 1755000000300
                  data:
                    text: 主人今天也要加油哦～
                    image: 可爱

    BalanceLeaf:
      type: object
      required: [counter, data]
      properties:
        counter:
          $ref: "#/components/schemas/Counter"
        data:
          description: |
            `BalanceState`；`null` = 从未写过。
            由宿主周期刷新（`eventsRefreshSec.balance`，默认 1800 秒）或 `POST /balance` 写入。
          oneOf:
            - $ref: "#/components/schemas/BalanceView"
            - $ref: "#/components/schemas/BalanceUnavailable"
            - type: "null"

    BalanceView:
      type: object
      required: [ok, provider, kind]
      description: 余额可用
      properties:
        ok:
          type: boolean
          const: true
        provider:
          type: string
          example: deepseek
        kind:
          type: string
          description: |
            服务商类型。`opencode` / `commandcode` 走三窗口用量（百分比），`deepseek` 走账户金额。
            `opencode` 三窗口均返回；`commandcode` 的 `monthly` 必有，`rolling`（5h）/ `weekly`
            只在套餐有窗口限制时返回——字段缺省表示「没有这个窗口」，不是「已用 0%」。
          enum: [opencode, deepseek, commandcode]
        manual:
          type: boolean
          description: |
            仅当本次写入是**手动触发**（`POST /balance`、`/balance` 命令、桌面「查看余额」菜单）
            时出现。消费端据此决定"余额不可用时要不要必弹文字说明"。
        rolling:
          type: number
          description: opencode / commandcode：5h 滚动窗口用量（0-100）
        weekly:
          type: number
          description: opencode / commandcode：周窗口用量（0-100）
        monthly:
          type: number
          description: opencode / commandcode：月窗口用量（0-100）
        rollingResetsAt:
          type: string
          format: date-time
          description: opencode / commandcode：滚动窗口（5h）重置时间
        weeklyResetsAt:
          type: string
          format: date-time
          description: opencode / commandcode：周窗口重置时间
        monthlyResetsAt:
          type: string
          format: date-time
          description: opencode / commandcode：月窗口重置时间
        rollingCapUsd:
          type: number
          description: commandcode：滚动窗口（5h）满额度（USD，接口回传）——「最紧迫窗口」判定用
        weeklyCapUsd:
          type: number
          description: commandcode：周窗口满额度（USD，接口回传）
        monthlyCapUsd:
          type: number
          description: commandcode：月窗口满额度（USD）= 当期消耗 + 剩余额度；无额度也无消耗时缺省
        currency:
          type: string
          description: deepseek：币种
        total:
          type: string
          description: deepseek：总余额（字符串，与上游接口一致）
        granted:
          type: string
          description: deepseek：赠送额度
        toppedUp:
          type: string
          description: deepseek：充值额度

    BalanceUnavailable:
      type: object
      required: [ok, provider, reason]
      description: 余额不可用（显式标记，不静默）
      properties:
        ok:
          type: boolean
          const: false
        provider:
          type: string
        manual:
          type: boolean
          description: 同 `BalanceView.manual`
        reason:
          type: string
          enum: [unsupported, credential-missing, fetch-error]
          description: |
            `unsupported` = 该服务商不支持查余额；
            `credential-missing` = 缺凭证；
            `fetch-error` = 抓取失败。
        message:
          type: string

    WorkStatusLeaf:
      type: object
      required: [counter, data]
      properties:
        counter:
          $ref: "#/components/schemas/Counter"
        data:
          description: |
            `WorkStatusSnapshot`；`null` = 从未写过。
            由宿主监听 DSH 会话事件（`turn/start`、`tool/call`、`tool/result`、
            `approval/asked`、`turn/end`）聚合后写入。
          oneOf:
            - $ref: "#/components/schemas/WorkStatusSnapshot"
            - type: "null"

    WorkStatusSnapshot:
      type: object
      required: [state, task]
      properties:
        state:
          description: |
            工作状态档位，对应配置 `animations.events.workStatus` 数组的索引。
            `null` = 空闲。
          oneOf:
            - type: string
              enum: [thinking, working, result, waiting, success, error]
            - type: "null"
        task:
          description: 当前任务详情（由 todo / write 工具提供），可为 `null`
          oneOf:
            - type: string
            - type: "null"

    NotifyLeaf:
      type: object
      required: [counter, data]
      properties:
        counter:
          $ref: "#/components/schemas/Counter"
        data:
          description: |
            通知帧；`null` = 从未写过。
            由宿主监听 DSH 宿主事件生成，浏览器轮询到变化后弹系统 toast。
            **单槽**：新通知直接覆盖旧的，不排队（1 秒轮询下同一拍只处理最新一条）。
          oneOf:
            - $ref: "#/components/schemas/NotifyFrame"
            - type: "null"

    NotifyFrame:
      oneOf:
        - $ref: "#/components/schemas/TurnEndFrame"
        - $ref: "#/components/schemas/ApprovalFrame"
        - $ref: "#/components/schemas/QuestionFrame"
        - $ref: "#/components/schemas/AgentErrorFrame"
      discriminator:
        propertyName: type
        mapping:
          session/event: "#/components/schemas/TurnEndFrame"
          approval/requested: "#/components/schemas/ApprovalFrame"
          question/requested: "#/components/schemas/QuestionFrame"
          host/agent-error: "#/components/schemas/AgentErrorFrame"

    TurnEndFrame:
      type: object
      required: [type, event]
      description: 一个回合结束（仅 `completed` / `error` / `max-tokens` 会通知；`aborted` 等不通知）
      properties:
        type:
          type: string
          const: session/event
        event:
          type: object
          required: [type, data]
          properties:
            type:
              type: string
              const: turn/end
            data:
              type: object
              properties:
                reason:
                  type: object
                  properties:
                    kind:
                      type: string
                      enum: [completed, error, max-tokens]
                    error:
                      type: object
                      properties:
                        message:
                          type: string

    ApprovalFrame:
      type: object
      required: [type]
      description: 模型在申请工具权限
      properties:
        type:
          type: string
          const: approval/requested
        toolName:
          type: string
          description: 申请权限的工具名（可选）
        reason:
          type: string
          description: 申请原因（可选）

    QuestionFrame:
      type: object
      required: [type, questions]
      description: 模型调用 `ask_user_question` 工具，在等用户回答
      properties:
        type:
          type: string
          const: question/requested
        questions:
          type: array
          minItems: 1
          items:
            type: object
            properties:
              question:
                type: string

    AgentErrorFrame:
      type: object
      required: [type, message]
      description: 无回合位置的生成失败（DSH 0.1.5+ 的 `agent/error` 事件）
      properties:
        type:
          type: string
          const: host/agent-error
        message:
          type: string

    AnimLeaf:
      type: object
      required: [counter, data]
      properties:
        counter:
          $ref: "#/components/schemas/Counter"
        data:
          description: |
            该宠物要播的动画；`null` = 从未写过。
            每次写入 counter 都递增，所以**同一个动画连续点播两次也会被消费端当成两次指令**
            （重播）。名字即素材文件名（`/thumb/<素材根>/<名字>.webm`），因此名字必须存在于
            该宠物的动画池内——由 `POST /anim` 在写入前校验。
          oneOf:
            - $ref: "#/components/schemas/Anim"
            - type: "null"

    Anim:
      type: object
      required: [name]
      properties:
        name:
          type: string
          description: 要播放的动画名（等于 `animations` 配置里菜单可点到的某个名字）
          example: 东张西望

    SayLeaf:
      type: object
      required: [counter, data]
      properties:
        counter:
          $ref: "#/components/schemas/Counter"
        data:
          description: |
            该宠物要说的话；`null` = 从未写过。
            **碎碎念、命令气泡、对话回复共用这一个叶子**——前端本来就是同一条展示链路
            （同一个气泡槽、同一批 `events.whisper` 动画）。
          oneOf:
            - $ref: "#/components/schemas/Say"
            - type: "null"

    Say:
      type: object
      required: [text]
      properties:
        text:
          type: string
          description: 要显示的文本（空文本会被消费端丢弃）
        image:
          type: string
          description: |
            可选配图**名称**（不是 URL）：配置 `memes` 的键，也就是该图文件的文件名（不含扩展名）。
            仅在配置开启了 `whisperImageEnabled` / `chatImageEnabled` 且命中池内图片时出现。
            消费端（浏览器 / 桌面）按素材根拼成 `/dsh-pet-7340/pic/memes/<素材根>/<名>.png`
            取图，素材根 = 该宠物的条目 key（`assetRoot`）。

    Counter:
      type: integer
      format: int64
      minimum: 0
      description: |
        叶子版本号。每次写入更新，取值 `Date.now()` 且**严格递增**
        （同毫秒连写会 +1），宿主重启也不会倒退。
        **就靠它判断"变了没有"**：与上次记录的值相同即跳过渲染。
        `0` 表示从未写过。

    ChatMemoryMessage:
      type: object
      required: [role, content, ts]
      properties:
        role:
          type: string
          enum: [user, assistant]
        content:
          type: string
          description: 消息正文（不含配图标记）
        ts:
          type: integer
          format: int64
          description: 写入时间戳（毫秒）

    Provider:
      type: object
      required: [id, name, models]
      properties:
        id:
          type: string
        name:
          type: string
          description: 显示名；缺失时回落为 `id`
        models:
          type: array
          description: 该服务商下的模型（列不出时为空数组）
          items:
            type: object
            required: [id, name]
            properties:
              id:
                type: string
              name:
                type: string

    StorageEntry:
      type: object
      description: 一处落盘位置
      properties:
        label:
          type: string
        path:
          type: string
      additionalProperties: true

    ModelSelection:
      type: object
      description: |
        条目级的模型指定。**`provider` 与 `model` 必须同时为空或同时非空**——
        两个都留空 = 跟随当前对话的模型；只填一个视为无效配置。
      required: [provider, model]
      properties:
        provider:
          type: string
        model:
          type: string

    Position:
      type: object
      required: [corner, marginX, marginY]
      properties:
        corner:
          type: string
          description: 停靠角
          enum: [top-left, top-right, bottom-left, bottom-right]
        marginX:
          type: number
          description: 水平边距（像素）
        marginY:
          type: number
          description: 垂直边距（像素）

    PetEntry:
      type: object
      description: 白名单内的宠物条目（`PUT /config` 的输入形状）
      required: [id, name, size, balanceEnabled, display, position]
      properties:
        id:
          type: string
          maxLength: 64
          description: 宠物 id。**不可含文件名非法字符**（Windows 保留符 + 控制字符）
        name:
          type: string
          description: 显示名；留空时宿主按 `id` 处理并告警
        size:
          type: number
          exclusiveMinimum: 0
          description: 宠物尺寸（像素）
        balanceEnabled:
          type: boolean
        whisperEnabled:
          type: boolean
          description: 是否开启周期碎碎念（**不门控** `POST /whisper`）
        workStatusEnabled:
          type: boolean
        fixedEnabled:
          type: boolean
          description: |
            宠物固定：`true` = 随机动画链不再抽「转向 / 移动」两档（宠物不自己翻朝向、不自己走开，
            只播原地待机与随机小动作）。**只影响随机链**——右键菜单点播、`POST /anim`、
            事件动画（余额/碎碎念/工作状态）、点击回应与拖拽均不受影响。缺失默认 `false`。
        display:
          type: string
          enum: [web, desktop, both, none]
          description: 显示在哪：仅浏览器 / 仅桌面 / 两者 / 都不显示
        position:
          $ref: "#/components/schemas/Position"

    SaveConfigRequest:
      type: object
      required: [pets]
      properties:
        pets:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/PetEntry"
        notificationsEnabled:
          type: boolean
        whisperImageEnabled:
          type: boolean
        chatImageEnabled:
          type: boolean
        confineToScreen:
          type: boolean
        chatMemoryRounds:
          type: integer
          minimum: 0
          description: |
            对话历史条数（全局默认）：每次对话请求携带的最近历史轮数，1 轮 = 1 问 1 答，
            0 = 不带历史。`memory.json` 全存不删，此值只决定截多少进上下文。
            设置页「AI 模型与对话上下文」区的数字输入框写的就是它。缺失默认 5。
        chatImageLimit:
          type: integer
          minimum: 0
          description: |
            对话配图张数上限（全局默认）：对话时发给模型的表情包清单最多几张（「前 N 张」= 配置里写在前面的
            那 N 条——`memes` 的书写顺序就是生效顺序，想让哪几张优先发出去就往前写）。
            **0 = 不限制（全部发）**。
            为什么要它：整张清单每条消息都要附，token 随张数线性增长，限制后配图开销上限可控。
            设置页「AI 模型与对话上下文」区的数字输入框写的就是它。缺失默认 10。

    PetConfigEntry:
      type: object
      description: |
        合并器填满后的条目配置。字段远多于 `PetEntry`——还包括
        `whisperPrompt`、`chatMemoryRounds`、`whisperModel`、`chatModel`、`memes`、
        `workStatusTexts`、`physics`、`animations`、`eventsRefreshSec`、`animationWeights` 等。
        完整字段与默认值见包内 `assets/config.jsonc`（带注释，是默认值的唯一来源）。
      properties:
        id:
          type: string
        name:
          type: string
        size:
          type: number
        balanceEnabled:
          type: boolean
        whisperEnabled:
          type: boolean
        workStatusEnabled:
          type: boolean
        fixedEnabled:
          type: boolean
          description: 宠物固定（随机链不再抽「转向 / 移动」两档；主动触发不受影响）
        display:
          type: string
          enum: [web, desktop, both, none]
        position:
          $ref: "#/components/schemas/Position"
        whisperPrompt:
          type: string
          description: 该宠物的人设提示词（碎碎念与对话共用）
        chatMemoryRounds:
          type: integer
          description: 对话记忆轮数（1 轮 = 1 问 1 答）
        whisperModel:
          $ref: "#/components/schemas/ModelSelection"
        chatModel:
          $ref: "#/components/schemas/ModelSelection"
        whisperImageEnabled:
          type: boolean
        chatImageEnabled:
          type: boolean
        chatImageLimit:
          type: integer
          minimum: 0
          description: 对话配图张数上限（0 = 不限制）；只影响对话选图，碎碎念只带抽中的那一张
        memes:
          type: object
          description: 表情包池——键为图片名，值为该图的语境描述（供模型选择）
          additionalProperties:
            type: string
        workStatusTexts:
          type: array
          description: 工作状态气泡文案，索引与 `animations.events.workStatus` 严格对齐
          items:
            type: string
        eventsRefreshSec:
          type: object
          description: 周期刷新间隔（秒）。这两个周期都由**宿主定时器**驱动，前端不轮询它们。
          properties:
            balance:
              type: integer
              default: 1800
              description: 余额刷新周期
            whisper:
              type: integer
              default: 300
              description: 周期碎碎念间隔
      additionalProperties: true

    # ---------- 中转站（/relays 子域） ----------

    RelayCredentialInput:
      type: object
      required: [kind]
      description: |
        凭证入参。`kind: 'manual'` 允许不带 `secret`（显式声明「无凭证、手工填余额」）。
        引导顺序：API Key 优先（覆盖面最广）→ AccessToken（账户级）→ Cookie（高级逃生）→ manual。
      properties:
        kind:
          type: string
          enum: [access-token, api-key, session-cookie, manual]
        secret:
          type: string
          description: 凭证值（绝不进任何响应体与日志）
        extraHeaders:
          type: object
          description: 附加请求头（值同样视为敏感，脱敏后才可外泄）
          additionalProperties:
            type: string

    RelaySiteInput:
      type: object
      required: [name, url, kind]
      description: |
        新建/更新站点的入参（`credential` 段可选，单独存储不进站点实体）。
        换算率未显式确认时写默认值 500000 并标记未确认（`rateConfirmed: false`）。
      properties:
        name:
          type: string
        url:
          type: string
          description: "Base URL（自动归一化：去尾斜杠、去 /v1 后缀）"
        kind:
          type: string
          enum: [new-api, sub2api, openai-compat]
        note:
          type: string
        quotaPerUnit:
          type: number
          description: "quota ↔ 金额换算率（默认 500000 quota = 1 USD，可按站覆盖）"
        rateConfirmed:
          type: boolean
          description: 换算率是否已确认（未确认的站余额带 rateUnconfirmed、不参与告警）
        lowThreshold:
          type: string
          description: 低余额阈值（金额，与 manualBalance.currency 同币种）
        enabled:
          type: boolean
          description: 是否参与刷新与告警
        manualBalance:
          type: object
          properties:
            amount:
              type: string
            currency:
              type: string
        credential:
          $ref: "#/components/schemas/RelayCredentialInput"

    RelaySiteView:
      type: object
      description: 站点 + 脱敏后的凭证摘要（**唯一允许出现在 API 响应里的形状**）
      required: [id, name, url, kind, quotaPerUnit, enabled, createdAt, updatedAt, credential]
      properties:
        id:
          type: string
        name:
          type: string
        url:
          type: string
        kind:
          type: string
        note:
          type: string
        quotaPerUnit:
          type: number
        rateConfirmed:
          type: boolean
        lowThreshold:
          type: string
        enabled:
          type: boolean
        manualBalance:
          type: object
          properties:
            amount:
              type: string
            currency:
              type: string
            updatedAt:
              type: string
              format: date-time
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        credential:
          type: object
          required: [kind, masked, present]
          properties:
            kind:
              type: string
              enum: [access-token, api-key, session-cookie, manual]
            masked:
              type: string
              description: "掩码预览（如 `sk-ab****wxyz`）；manual 时为空串"
            present:
              type: boolean
            extraHeaders:
              type: object
              description: 脱敏后的附加请求头（键保留、值全掩）
              additionalProperties:
                type: string
            lastValidatedAt:
              type: string
              format: date-time

    RelayBalanceResult:
      description: |
        单站余额结果。**绝不伪造 0 余额**：查不到就是查不到，落对应 reason。
        无限额度站（`unlimited_quota` 或 1e8 哨兵）的 `data.total` 是**已用金额**而非余额。
      oneOf:
        - type: object
          required: [ok, siteId, provider, shape, source, data]
          properties:
            ok:
              type: boolean
              const: true
            siteId:
              type: string
            provider:
              type: string
              description: "provider id（`relay:<kind>`），展示层据此区分来源"
            shape:
              type: string
              const: money
            source:
              type: string
              enum: [auto, manual]
            scope:
              type: string
              enum: [account, token]
              description: "account = 账户级（/api/user/self）；token = 令牌级（usage/token、billing）"
            unlimited:
              type: boolean
            spent:
              type: string
              description: 已用金额（unlimited 时与 data.total 同值）
            rateUnconfirmed:
              type: boolean
              description: 换算率未确认：客户端提示核对，且该站不参与低余额告警
            data:
              $ref: "#/components/schemas/BalanceView"
        - type: object
          required: [ok, siteId, provider, reason]
          properties:
            ok:
              type: boolean
              const: false
            siteId:
              type: string
            provider:
              type: string
            reason:
              type: string
              description: |
                `unsupported` 未登记的站点类型 / `credential-missing` 未配置凭证 /
                `fetch-error` 抓取失败 / `manual` 降级路径（手工填写，带「手工」标签与时间）/
                `blocked` 被 Cloudflare / 反代 / Bot Detection 拦 / `rate-limited` 站点 429
                或失败退避中。
              enum: [unsupported, credential-missing, fetch-error, manual, blocked, rate-limited]
            message:
              type: string

    RelayHealthResult:
      type: object
      required: [siteId, health, checkedAt]
      properties:
        siteId:
          type: string
        health:
          type: string
          enum: [online, unreachable, auth-failed, blocked, unknown]
        endpoint:
          type: string
        status:
          type: integer
        message:
          type: string
        latencyMs:
          type: integer
        checkedAt:
          type: string
          format: date-time

    RelayDetectResult:
      type: object
      required: [kind, confidence, evidence]
      properties:
        kind:
          type: string
          enum: [new-api, sub2api, openai-compat, unknown]
        confidence:
          type: string
          enum: [certain, likely, unknown]
          description: "certain = 双信号命中；likely = 单信号；unknown = 无信号（引导手选，不静默失败）"
        evidence:
          type: array
          description: 判定依据（人类可读，给 UI 展示「为什么判定成这个类型」）
          items:
            type: string
        suggestedQuotaPerUnit:
          type: number
        displayInCurrency:
          type: boolean
        message:
          type: string
          description: 探测失败时的人类可读原因（kind = unknown 时）

    RelayModelEntry:
      type: object
      required: [id]
      properties:
        id:
          type: string
        ratio:
          type: number
          description: "模型倍率（model_ratio，按 token 计费的站；0 是合法值）"
        price:
          type: number
          description: "模型固定价格（model_price，按次计费的站）"

    RelayModelRow:
      type: object
      required: [id, sites]
      properties:
        id:
          type: string
        sites:
          type: array
          description: 覆盖全部站点的格子（按名称排序）
          items:
            type: object
            required: [siteId, name, available]
            properties:
              siteId:
                type: string
              name:
                type: string
              available:
                type: [boolean, "null"]
                description: "true = 该站有这模型；false = 抓过且没有（明确不可用）；null = 未抓过（未知，绝不猜成没有）"
              ratio:
                type: number
              price:
                type: number

    RelayFleetSummary:
      type: object
      description: |
        舰队汇总（`sections.relays` 叶子的 summary 字段）。无限额度站**不计入**
        total / siteCount（它们的「剩余」不可计），单列 `unlimitedCount`。
      properties:
        currency:
          type: string
        total:
          type: string
        fullBalance:
          type: string
        siteCount:
          type: integer
        unlimitedCount:
          type: integer
        failedCount:
          type: integer
        lowSites:
          type: array
          items:
            type: object
            properties:
              siteId:
                type: string
              name:
                type: string
              amount:
                type: string
              currency:
                type: string
              threshold:
                type: string
        otherCurrencies:
          type: array
          description: 被排除的其他币种（多币种不混算，如实列出）
          items:
            type: string

    RelayLeaf:
      type: object
      required: [counter, data]
      description: |
        `sections.relays` 状态叶。宿主有启用站点时每拍刷新（与 `sections.balance` 并存，
        **绝不合流**）；没有启用站点时 `data` 保持 null。
      properties:
        counter:
          $ref: "#/components/schemas/Counter"
        data:
          oneOf:
            - type: object
              properties:
                focusSiteId:
                  type: [string, "null"]
                  description: 焦点站点（只影响展示口径，绝不做请求转发）
                summary:
                  $ref: "#/components/schemas/RelayFleetSummary"
                sites:
                  type: array
                  items:
                    $ref: "#/components/schemas/RelayBalanceResult"
                health:
                  type: array
                  items:
                    $ref: "#/components/schemas/RelayHealthResult"
                refreshedAt:
                  type: string
                  format: date-time
            - type: "null"

    AgentsLeaf:
      type: object
      required: [counter, data]
      description: |
        `sections.agents` 状态叶（docs/19 §4.2 在场投影）。与 `sections.workStatus`
        **同源分工**：workStatus 答「桌宠该播哪档动画」（单值仲裁），agents 答
        「谁在场、各自什么状态、谁在干活」（列表投影）。签名不变不写（counter 不空转）；
        没有 agent 在场时写空列表（**不是 null**——「查不到就是空数组」）。
      properties:
        counter:
          $ref: "#/components/schemas/Counter"
        data:
          $ref: "#/components/schemas/AgentsSectionData"

    AgentsSectionData:
      type: object
      required: [agents, activeCount]
      properties:
        agents:
          type: array
          description: 在场条目（按 agentId 排序，与 `GET /agents` 一致）
          items:
            $ref: "#/components/schemas/AgentPresenceItem"
        activeCount:
          type: integer
          description: state ∈ thinking/working/result/waiting/error 的个数（success 终态与空闲不算）

    AgentPresenceItem:
      type: object
      required: [agentId, kind, state, task, lastSeenAt, expiresAt]
      properties:
        agentId:
          type: string
        kind:
          type: string
          description: 原始 kind 字符串（展示元数据与降级在客户端注册表，host 只搬运）
        state:
          description: 该 agent 合成会话 `http:<agentId>` 的当前档位；无会话 → null
          oneOf:
            - type: string
              enum: [thinking, working, result, waiting, success, error]
            - type: "null"
        task:
          description: 该 agent 的任务详情（`POST /events` 的 task 段透传；≤40 码点）
          oneOf:
            - type: string
            - type: "null"
        lastSeenAt:
          type: integer
          description: epoch ms（最近一次 hello）
        expiresAt:
          type: integer
          description: epoch ms（TTL 60s）

    # ---------- 宿主无关网关（T07） ----------

    CapabilitiesPayload:
      type: object
      required: [ok, schema, instanceId, mode, hostCapabilities, tiers, relayKinds]
      properties:
        ok:
          type: boolean
        schema:
          type: integer
          const: 1
        instanceId:
          type: string
          description: 与发现文件（gateways/<pid>.json）里的同源，供复核
        mode:
          type: string
          enum: [standalone, dsh]
        hostCapabilities:
          type: object
          required: [llm, credentials, account, sessionEvents]
          properties:
            llm:
              type: boolean
            credentials:
              type: string
              enum: [none, dsh, local-file]
              description: "dsh = DSH 凭证库；local-file = relays 目录的 0600 文件（独立模式）"
            account:
              type: boolean
            sessionEvents:
              type: string
              enum: [none, dsh, http]
              description: "dsh = DSH 会话事件在场（POST /events 的 status 段被忽略）；http = 摄入轨"
        tiers:
          type: object
          description: 端点档位表（路径相对 /dsh-pet-7340）
          additionalProperties:
            type: array
            items:
              type: string
        relayKinds:
          type: array
          items:
            type: string
        agentCount:
          type: integer
        tokenRequired:
          type: boolean
        sseMaxConnections:
          type: integer
        httpIngest:
          type: boolean

    AgentView:
      type: object
      required: [agentId, kind, lastSeenAt, expiresAt]
      properties:
        agentId:
          type: string
        kind:
          type: string
        lastSeenAt:
          type: integer
          description: epoch ms
        expiresAt:
          type: integer
          description: epoch ms（TTL 60s）
